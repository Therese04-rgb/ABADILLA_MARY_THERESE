<!DOCTYPE html>
<html>
<head>

    <title> CSS ACTIVITY 2</title>

    <style> 
    body{margin: 20px; font-family: arial; font-weight: bold;}

.row{margin-bottom: 40px;}
.box {display: inline-block; margin-right: 60px;}

.a2-button{
    background-color:black;
    color:white;
    border: 2px solid white; 
    height: 40px; 
    width: 130px; 
    cursor: pointer;}

.b2-button{
    background-color:rgb(255,216,20);
    border: none; 
    height: 40px; 
    width: 150px; 
    border-radius: 20px; 
    cursor: pointer;}

.c2-button{
    background-color:rgb(46,164,79);
    border: none; 
    color: white;
    height: 40px; 
    width: 100px; 
    border-radius: 6px;
    font-weight: bold; 
    cursor: pointer;}

.d2-button{
    background-color:rgb(121,82,179);
    border: none;
    color: white;
    height: 40px; 
    width: 120px; 
    border-radius: 4px; 
    font-weight: bold;
    cursor: pointer; 
    margin-right: 10px;}

.d2download-button{
    background-color:white; 
    border: 1px solid rgb(108,117,125); 
    color:rgb(108, 117, 125);
    height: 40px; 
    width: 120px; 
    border-radius: 4px; 
    font-weight: bold;
    cursor: pointer;}
    
.e2-button{
    background-color:rgb(10,102,194);
    border: none;
    color: white;
    height: 45px; 
    width: 260px; 
    border-radius: 25px; 
    font-weight: bold;
    cursor: pointer; 
    margin-right: 10px;}

.e2save-button{
    background-color:white; 
    border: 1px solid rgb(10,102,194); 
    color:rgb(10, 102, 194);
    height: 45px; width: 100px; 
    border-radius: 25px; 
    font-weight: bold;
    cursor: pointer;}

    </style>
</head>

<body>
    <div class="row">
        <div class="box"> 
        <p> 2a. Uber</p>
        <button class="a2-button">Request now</button>
    </div>

    
    <div class="box">
        <p> 2b. Amazon</p>
        <button class="b2-button">Add to Cart</button>
    </div>


    <div class="box"> 
        <p> 2c. GitHub</p>
        <button class="c2-button">Sign up</button>
    </div>
</div>


<div class="row">
   <div class="box">
        <p> 2d. Bootstrap</p>
        <button class="d2-button">Get started</button>
        <button class="d2download-button">Download</button>
    </div>

    <div class="box">
        <p> 2e. LinkedIn</p>
        <button class="e2-button">Apply on company website</button>
        <button class="e2save-button">Save</button>
    </div>
</div>
    
</body>
</html>
